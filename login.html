<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - LoveEssay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255, 221, 171, 0.75), transparent 28%),
                radial-gradient(circle at bottom right, rgba(135, 206, 235, 0.55), transparent 24%),
                linear-gradient(145deg, #f5efe6 0%, #efe4d7 45%, #e4eef4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #2f2a25;
        }

        .shell {
            width: min(100%, 980px);
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            border-radius: 28px;
            overflow: hidden;
            background: rgba(255, 252, 248, 0.82);
            backdrop-filter: blur(18px);
            box-shadow: 0 28px 80px rgba(58, 38, 20, 0.18);
            border: 1px solid rgba(111, 84, 53, 0.14);
        }

        .story {
            padding: 52px 44px;
            background:
                linear-gradient(180deg, rgba(109, 79, 48, 0.08), rgba(109, 79, 48, 0.02)),
                repeating-linear-gradient(
                    135deg,
                    rgba(125, 91, 54, 0.07),
                    rgba(125, 91, 54, 0.07) 12px,
                    rgba(255, 255, 255, 0.02) 12px,
                    rgba(255, 255, 255, 0.02) 24px
                );
        }

        .story h1 {
            font-size: clamp(34px, 4vw, 52px);
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 18px;
            color: #3a2415;
        }

        .story p {
            max-width: 34rem;
            line-height: 1.8;
            color: #5f4d3f;
            font-size: 15px;
        }

        .chips {
            margin-top: 28px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(255, 248, 241, 0.82);
            border: 1px solid rgba(120, 86, 53, 0.14);
            font-size: 13px;
            color: #694a31;
        }

        .panel {
            padding: 44px 34px;
            background: rgba(255, 255, 255, 0.88);
            border-left: 1px solid rgba(111, 84, 53, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .panel h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #2b2119;
        }

        .panel .sub {
            color: #7b6958;
            font-size: 14px;
            margin-bottom: 26px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #564434;
            font-size: 13px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            border: 1px solid rgba(114, 85, 58, 0.18);
            background: #fffdfa;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input:focus {
            outline: none;
            border-color: #ad7a47;
            box-shadow: 0 0 0 4px rgba(173, 122, 71, 0.12);
        }

        .error {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff0ec;
            color: #b94d2f;
            border: 1px solid rgba(185, 77, 47, 0.2);
            font-size: 14px;
        }

        .error.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px 16px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, #8f5d2f 0%, #c48a52 100%);
            box-shadow: 0 14px 32px rgba(143, 93, 47, 0.25);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 38px rgba(143, 93, 47, 0.28);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .hint {
            margin-top: 14px;
            font-size: 12px;
            color: #8a7868;
            line-height: 1.6;
        }

        @media (max-width: 820px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .story {
                padding: 38px 28px 22px;
            }

            .panel {
                padding: 28px;
                border-left: none;
                border-top: 1px solid rgba(111, 84, 53, 0.1);
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="story">
            <h1>LoveEssay</h1>
            <p>登录后即可使用文书工作流。当前版本保留单账号入口，主要用于解决浏览器原生 Basic Auth 弹窗不可控、输错后难以重新认证的问题。</p>
            <div class="chips">
                <span class="chip">Word 材料上传</span>
                <span class="chip">LangGraph 工作流</span>
                <span class="chip">阿里云模型编排</span>
                <span class="chip">异步任务结果页</span>
            </div>
        </section>

        <section class="panel">
            <h2>账号登录</h2>
            <p class="sub">输入部署环境中配置的用户名和密码。</p>

            <form id="loginForm">
                <div class="error" id="errorBox"></div>

                <div class="field">
                    <label for="username">用户名</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>

                <button class="submit-btn" id="submitBtn" type="submit">进入工作台</button>
                <p class="hint">如果刚输错过密码，现在可以直接在这个页面重新输入，不需要和浏览器认证弹窗对抗。</p>
            </form>
        </section>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorBox = document.getElementById('errorBox');
        const next = new URLSearchParams(window.location.search).get('next') || '/';

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            submitBtn.disabled = true;
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, next })
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.error || '登录失败');
                }

                window.location.href = payload.redirect || next;
            } catch (error) {
                showError(error.message || '登录失败');
            } finally {
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('active');
        }

        function hideError() {
            errorBox.classList.remove('active');
        }
    </script>
</body>
</html>

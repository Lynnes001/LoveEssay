services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-8000}
    command: uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A tasks.celery_app.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loveessay}
      POSTGRES_USER: ${POSTGRES_USER:-loveessay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loveessay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loveessay} -d ${POSTGRES_DB:-loveessay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    volumes:
      - redis-data:/data

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    depends_on:
      - web
    ports:
      - "${HOST_PORT:-8000}:80"
    volumes:
      - ./nginx/admissioncraft.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres-data:
  redis-data:

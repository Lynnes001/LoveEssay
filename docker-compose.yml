name: loveessay

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    platform: ${DOCKER_PLATFORM:-}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loveessay}
      POSTGRES_USER: ${POSTGRES_USER:-loveessay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-db-password}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loveessay} -d ${POSTGRES_DB:-loveessay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    platform: ${DOCKER_PLATFORM:-}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    platform: ${DOCKER_PLATFORM:-}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-bookworm-slim}
    command: ["npm", "start"]
    environment:
      PORT: 6789
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:6788}
      DATABASE_URL: postgresql://${POSTGRES_USER:-loveessay}:${POSTGRES_PASSWORD:-change-db-password}@postgres:5432/${POSTGRES_DB:-loveessay}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      APP_LOGIN_USER: ${APP_LOGIN_USER:-}
      APP_LOGIN_PASS: ${APP_LOGIN_PASS:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-loveessay}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-qwen3.5-plus}
      DRAFT_MODEL: ${DRAFT_MODEL:-qwen3.5-plus}
      REWRITE_MODEL: ${REWRITE_MODEL:-qwen3-14b-81bba393c391}
      CHECK_MODEL: ${CHECK_MODEL:-qwen3.5-plus}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    platform: ${DOCKER_PLATFORM:-}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-bookworm-slim}
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loveessay}:${POSTGRES_PASSWORD:-change-db-password}@postgres:5432/${POSTGRES_DB:-loveessay}
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-loveessay}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-qwen3.5-plus}
      DRAFT_MODEL: ${DRAFT_MODEL:-qwen3.5-plus}
      REWRITE_MODEL: ${REWRITE_MODEL:-qwen3-14b-81bba393c391}
      CHECK_MODEL: ${CHECK_MODEL:-qwen3.5-plus}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    platform: ${DOCKER_PLATFORM:-}
    ports: ["${HOST_PORT:-6788}:80"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  pgadmin:
    image: ${PGADMIN_IMAGE:-crpi-n8xq04c9r8533fv2.cn-chengdu.personal.cr.aliyuncs.com/sid729/pgadmin:8.14-amd64}
    platform: ${DOCKER_PLATFORM:-}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-pgadmin-password}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 30
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin-data:

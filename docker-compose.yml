services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: loveessay
      POSTGRES_USER: loveessay
      POSTGRES_PASSWORD: loveessay
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loveessay -d loveessay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-bookworm-slim}
    command: ["npm", "start"]
    environment:
      PORT: 6789
      PUBLIC_BASE_URL: http://localhost:6788
      DATABASE_URL: postgresql://loveessay:loveessay@postgres:5432/loveessay
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      APP_LOGIN_USER: ${APP_LOGIN_USER:-}
      APP_LOGIN_PASS: ${APP_LOGIN_PASS:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-loveessay}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-qwen3.5-plus}
      DRAFT_MODEL: ${DRAFT_MODEL:-qwen3.5-plus}
      REWRITE_MODEL: ${REWRITE_MODEL:-qwen3-14b-81bba393c391}
      CHECK_MODEL: ${CHECK_MODEL:-qwen3.5-plus}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-bookworm-slim}
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://loveessay:loveessay@postgres:5432/loveessay
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-loveessay}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-qwen3.5-plus}
      DRAFT_MODEL: ${DRAFT_MODEL:-qwen3.5-plus}
      REWRITE_MODEL: ${REWRITE_MODEL:-qwen3-14b-81bba393c391}
      CHECK_MODEL: ${CHECK_MODEL:-qwen3.5-plus}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "6788:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

name: Deploy To Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight SSH check
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST }}
          SSH_USER: ${{ secrets.ALIYUN_USER }}
          SSH_PORT: ${{ secrets.ALIYUN_SSH_PORT }}
          SSH_KEY: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_PORT:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "缺少 SSH 相关 Secrets: ALIYUN_HOST / ALIYUN_USER / ALIYUN_SSH_PORT / ALIYUN_SSH_PRIVATE_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/loveessay_deploy_key
          chmod 600 ~/.ssh/loveessay_deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh \
            -i ~/.ssh/loveessay_deploy_key \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            "echo github-actions-ssh-ok"

      - name: Upload project files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_PASSPHRASE }}
          port: ${{ secrets.ALIYUN_SSH_PORT }}
          source: "."
          target: "/root/LoveEssay"
          overwrite: true
          rm: false
          strip_components: 0

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          WORKFLOW_APP_ID: ${{ secrets.WORKFLOW_APP_ID }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.ALIYUN_SSH_PASSPHRASE }}
          port: ${{ secrets.ALIYUN_SSH_PORT }}
          envs: DASHSCOPE_API_KEY,BASIC_AUTH_USER,BASIC_AUTH_PASS,WORKFLOW_APP_ID
          script_stop: true
          script: |
            set -euo pipefail
            if [ -z "${DASHSCOPE_API_KEY:-}" ] || [ -z "${WORKFLOW_APP_ID:-}" ] || [ -z "${BASIC_AUTH_USER:-}" ] || [ -z "${BASIC_AUTH_PASS:-}" ]; then
              echo "缺少必填 GitHub Secrets: DASHSCOPE_API_KEY / WORKFLOW_APP_ID / BASIC_AUTH_USER / BASIC_AUTH_PASS"
              exit 1
            fi

            if [ "${BASIC_AUTH_PASS}" = "change-me" ]; then
              echo "BASIC_AUTH_PASS 不能为默认值 change-me"
              exit 1
            fi

            cd /root/LoveEssay
            chmod +x deploy.sh scripts/deploy_server.sh

            sudo mkdir -p /etc/loveessay
            sudo tee /etc/loveessay/loveessay.env > /dev/null <<EOT
            DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
            PORT=6789
            WORKFLOW_APP_ID=${WORKFLOW_APP_ID}
            RATE_LIMIT_PER_MINUTE=30
            BASIC_AUTH_USER=${BASIC_AUTH_USER}
            BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
            EOT
            sudo chmod 600 /etc/loveessay/loveessay.env

            sudo ./deploy.sh

            sudo systemctl is-active loveessay
            sudo systemctl is-active nginx

            ok=0
            for i in $(seq 1 15); do
              if curl -sS --fail -u "${BASIC_AUTH_USER}:${BASIC_AUTH_PASS}" http://127.0.0.1:6788/api/health > /dev/null; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "$ok" -ne 1 ]; then
              echo "健康检查失败，输出服务诊断信息..."
              sudo systemctl status loveessay --no-pager || true
              sudo journalctl -u loveessay -n 120 --no-pager || true
              sudo systemctl status nginx --no-pager || true
              exit 1
            fi

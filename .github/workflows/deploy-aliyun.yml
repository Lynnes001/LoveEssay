name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p /opt/admissioncraft

      - name: Upload repository to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: /opt/admissioncraft
          overwrite: true
          rm: true

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          BASIC_AUTH_USER: ${{ vars.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          DRAFT_MODEL_API_KEY: ${{ secrets.DRAFT_MODEL_API_KEY }}
          POLISH_MODEL_API_KEY: ${{ secrets.POLISH_MODEL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          DEPLOY_HOST_PORT: ${{ vars.DEPLOY_HOST_PORT }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          POSTGRES_IMAGE: ${{ vars.POSTGRES_IMAGE }}
          REDIS_IMAGE: ${{ vars.REDIS_IMAGE }}
          NGINX_IMAGE: ${{ vars.NGINX_IMAGE }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          envs: BASIC_AUTH_USER,BASIC_AUTH_PASS,DRAFT_MODEL_API_KEY,POLISH_MODEL_API_KEY,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_USER,DEPLOY_HOST_PORT,ACR_USERNAME,ACR_PASSWORD,POSTGRES_IMAGE,REDIS_IMAGE,NGINX_IMAGE,LANGSMITH_API_KEY,LANGSMITH_PROJECT,LANGSMITH_TRACING
          script: |
            set -euo pipefail
            cd /opt/admissioncraft
            bash ./scripts/deploy_server.sh

name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deploy directory on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p /opt/admissioncraft

      - name: Upload repository to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: /opt/admissioncraft
          overwrite: true
          rm: true

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_LOGIN_USER: ${{ vars.APP_LOGIN_USER }}
          APP_LOGIN_PASS: ${{ secrets.APP_LOGIN_PASS }}
          DRAFT_MODEL_API_KEY: ${{ secrets.DRAFT_MODEL_API_KEY }}
          DRAFT_MODEL_BASE_URL: ${{ vars.DRAFT_MODEL_BASE_URL }}
          DRAFT_MODEL_NAME: ${{ vars.DRAFT_MODEL_NAME }}
          POLISH_MODEL_API_KEY: ${{ secrets.POLISH_MODEL_API_KEY }}
          POLISH_MODEL_BASE_URL: ${{ vars.POLISH_MODEL_BASE_URL }}
          POLISH_MODEL_NAME: ${{ vars.POLISH_MODEL_NAME }}
          DEPLOY_HOST_PORT: ${{ vars.DEPLOY_HOST_PORT }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          POSTGRES_IMAGE: ${{ vars.POSTGRES_IMAGE }}
          REDIS_IMAGE: ${{ vars.REDIS_IMAGE }}
          NGINX_IMAGE: ${{ vars.NGINX_IMAGE }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ vars.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          port: 22
          envs: APP_LOGIN_USER,APP_LOGIN_PASS,DRAFT_MODEL_API_KEY,DRAFT_MODEL_BASE_URL,DRAFT_MODEL_NAME,POLISH_MODEL_API_KEY,POLISH_MODEL_BASE_URL,POLISH_MODEL_NAME,DEPLOY_HOST_PORT,ACR_USERNAME,ACR_PASSWORD,POSTGRES_IMAGE,REDIS_IMAGE,NGINX_IMAGE
          script: |
            set -euo pipefail
            cd /opt/admissioncraft
            bash ./scripts/deploy_server.sh

name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          _SSH_HOST: ${{ secrets.SSH_HOST }}
          _SSH_USER: ${{ secrets.SSH_USER }}
          _SSH_KEY: ${{ secrets.SSH_KEY }}
          _DRAFT_MODEL_API_KEY: ${{ secrets.DRAFT_MODEL_API_KEY }}
          _POLISH_MODEL_API_KEY: ${{ secrets.POLISH_MODEL_API_KEY }}
          _POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${_SSH_HOST:-}"             ] || missing+=(SSH_HOST)
          [ -n "${_SSH_USER:-}"             ] || missing+=(SSH_USER)
          [ -n "${_SSH_KEY:-}"              ] || missing+=(SSH_KEY)
          [ -n "${_DRAFT_MODEL_API_KEY:-}"  ] || missing+=(DRAFT_MODEL_API_KEY)
          [ -n "${_POLISH_MODEL_API_KEY:-}" ] || missing+=(POLISH_MODEL_API_KEY)
          [ -n "${_POSTGRES_PASSWORD:-}"    ] || missing+=(POSTGRES_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare deploy directory on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: mkdir -p /opt/admissioncraft

      - name: Upload repository to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: "."
          target: /opt/admissioncraft
          overwrite: true
          rm: true

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRAFT_MODEL_API_KEY: ${{ secrets.DRAFT_MODEL_API_KEY }}
          POLISH_MODEL_API_KEY: ${{ secrets.POLISH_MODEL_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DRAFT_MODEL_BASE_URL: ${{ secrets.DRAFT_MODEL_BASE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          envs: DRAFT_MODEL_API_KEY,POLISH_MODEL_API_KEY,POSTGRES_PASSWORD,DRAFT_MODEL_BASE_URL
          script: |
            set -euo pipefail
            cd /opt/admissioncraft
            bash ./scripts/deploy_server.sh

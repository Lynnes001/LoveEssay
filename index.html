<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文书润色助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin-top: 8px;
            opacity: 0.9;
            font-size: 14px;
        }

        .form {
            padding: 30px 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input[type="file"] {
            padding: 10px 12px;
            background: #f9fafb;
        }

        .form-group .hint {
            margin-top: 6px;
            font-size: 12px;
            color: #6b7280;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .error-msg.active {
            display: block;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            padding: 18px 20px 0;
        }

        .logout-link {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <button class="logout-link" type="button" onclick="logout()">退出登录</button>
        </div>
        <div class="header">
            <h1>🎓 文书润色助手</h1>
            <p>输入学生信息，获取专业文书润色建议</p>
        </div>

        <form class="form" id="formContainer">
            <div class="error-msg" id="errorMsg"></div>

            <div class="form-group">
                <label for="school_name">目标学校名称</label>
                <input type="text" id="school_name" name="school_name" placeholder="例如：斯坦福大学" required>
            </div>

            <div class="form-group">
                <label for="query">润色要求（可选）</label>
                <input type="text" id="query" name="query" placeholder="例如：突出领导力，强调科研经历">
                <p class="hint">如有特殊要求请填写，如无需留空</p>
            </div>

            <div class="form-group">
                <label for="notes">补充说明（可选）</label>
                <textarea id="notes" name="notes" placeholder="可补充说明材料来源、希望强调的主题、注意不要写入文书的内容等"></textarea>
                <p class="hint">这里适合补充家长备注、顾问提醒、材料使用边界等</p>
            </div>

            <div class="form-group">
                <label for="material_file">学生材料 Word 文件</label>
                <input type="file" id="material_file" name="material_file" accept=".docx" required>
                <p class="hint">当前版本仅支持上传 .docx，内容可以混合简历、活动列表、学校说明和家长补充</p>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">提交申请</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在提交，请稍候...</p>
            <p style="margin-top: 8px; font-size: 12px; color: #6b7280;">AI正在润色您的文书</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('formContainer');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const school_name = document.getElementById('school_name').value.trim();
            const query = document.getElementById('query').value.trim();
            const notes = document.getElementById('notes').value.trim();
            const materialFile = document.getElementById('material_file').files[0];

            if (!school_name || !materialFile) {
                showError('请填写学校名称并上传 Word 材料');
                return;
            }

            showLoading(true);
            hideError();

            const formData = new FormData();
            formData.append('school_name', school_name);
            formData.append('query', query || '请写出一篇真实、克制、具有说服力的英文个人陈述');
            formData.append('notes', notes);
            formData.append('material_file', materialFile);

            try {
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    body: formData
                });

                const payload = await response.json().catch(() => ({}));
                if (response.status === 401 && payload.redirect) {
                    window.location.href = payload.redirect;
                    return;
                }
                if (!response.ok || !payload.task_id) {
                    throw new Error(payload.error || '创建生成任务失败，请重试');
                }

                sessionStorage.removeItem('essay_result');
                sessionStorage.setItem('essay_task_id', payload.task_id);
                window.location.href = `result.html?task=${encodeURIComponent(payload.task_id)}`;
            } catch (error) {
                showLoading(false);
                showError(error.message || '提交失败，请稍后重试');
            }
        });

        function showLoading(show) {
            submitBtn.disabled = show;
            form.style.display = show ? 'none' : 'block';
            loading.classList.toggle('active', show);
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('active');
        }

        function hideError() {
            errorMsg.classList.remove('active');
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
            window.location.href = '/login';
        }
    </script>
</body>
</html>

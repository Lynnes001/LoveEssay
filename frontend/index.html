<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdmissionCraft</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <div class="platform-shell">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <p class="sidebar-logo-name">AdmissionCraft</p>
          <p class="sidebar-logo-sub">Writing Platform</p>
        </div>

        <nav class="sidebar-nav">
          <button class="sidebar-item active" data-tool="essay-writer">
            <svg class="sidebar-item-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M13.586 3.586a2 2 0 1 1 2.828 2.828l-.793.793-2.828-2.828.793-.793ZM11.379 5.793 3 14.172V17h2.828l8.38-8.379-2.83-2.828Z"/>
            </svg>
            <span class="sidebar-item-label">Essay Writer</span>
          </button>

          <button class="sidebar-item" data-tool="profile-builder">
            <svg class="sidebar-item-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-7 9a7 7 0 1 1 14 0H3Z" clip-rule="evenodd"/>
            </svg>
            <span class="sidebar-item-label">Profile Builder</span>
            <span class="sidebar-item-badge">Soon</span>
          </button>

          <button class="sidebar-item" data-tool="school-research">
            <svg class="sidebar-item-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path d="M10.394 2.08a1 1 0 0 0-.788 0l-7 3a1 1 0 0 0 0 1.84L5.25 8.051a.999.999 0 0 1 .356-.257l4-1.714a1 1 0 1 1 .788 1.838L7.667 9.088l1.94.831a1 1 0 0 0 .787 0l7-3a1 1 0 0 0 0-1.838l-7-3ZM3.31 9.397 5 10.12v4.102a8.969 8.969 0 0 0-1.05-.174 1 1 0 0 1-.89-.89 11.115 11.115 0 0 1 .25-3.762Zm5.99 7.176A9.026 9.026 0 0 0 10 17a9.026 9.026 0 0 0 .7-.027V13.03a9.024 9.024 0 0 1-1.4-.832V16.573ZM14 10.12l1.69-.72a11.115 11.115 0 0 1 .25 3.762 1 1 0 0 1-.89.89 8.968 8.968 0 0 0-1.05.174V10.12Z"/>
            </svg>
            <span class="sidebar-item-label">School Research</span>
            <span class="sidebar-item-badge">Soon</span>
          </button>

          <button class="sidebar-item" data-tool="short-answers">
            <svg class="sidebar-item-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 0 1-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7ZM7 9H5v2h2V9Zm8 0h-2v2h2V9ZM9 9h2v2H9V9Z" clip-rule="evenodd"/>
            </svg>
            <span class="sidebar-item-label">Short Answers</span>
            <span class="sidebar-item-badge">Soon</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button class="sidebar-logout" id="logout-btn">
            <svg style="width:16px;height:16px;flex-shrink:0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M3 4.25A2.25 2.25 0 0 1 5.25 2h5.5A2.25 2.25 0 0 1 13 4.25v2a.75.75 0 0 1-1.5 0v-2a.75.75 0 0 0-.75-.75h-5.5a.75.75 0 0 0-.75.75v11.5c0 .414.336.75.75.75h5.5a.75.75 0 0 0 .75-.75v-2a.75.75 0 0 1 1.5 0v2A2.25 2.25 0 0 1 10.75 18h-5.5A2.25 2.25 0 0 1 3 15.75V4.25Zm8.47 4.97a.75.75 0 0 1 1.06 0l2.25 2.25a.75.75 0 0 1 0 1.06l-2.25 2.25a.75.75 0 1 1-1.06-1.06l.97-.97H8a.75.75 0 0 1 0-1.5h4.44l-.97-.97a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
            </svg>
            Logout
          </button>
        </div>
      </aside>

      <main class="platform-main" id="platform-main">
        <div id="tool-essay-writer">
          <main class="app-shell">
            <header class="status-bar" aria-label="任务状态总览">
              <div class="status-bar__brand">
                <p class="eyebrow">AdmissionCraft Console</p>
                <h1>Phase 1 Workbench</h1>
              </div>
              <dl class="status-grid">
                <div class="status-card">
                  <dt class="meta-label">Task</dt>
                  <dd id="task-meta">尚未启动</dd>
                </div>
                <div class="status-card">
                  <dt class="meta-label">Status</dt>
                  <dd id="task-status" data-state="idle">idle</dd>
                </div>
                <div class="status-card">
                  <dt class="meta-label">Stage</dt>
                  <dd id="task-stage" data-stage="idle">idle</dd>
                </div>
              </dl>
            </header>

            <section class="workspace">
              <aside class="control-panel">
                <div class="panel-heading">
                  <p class="eyebrow">Control Panel</p>
                  <h2>Run pipeline</h2>
                  <p class="lede">配置材料与要求，启动三阶段生成流水线。</p>
                </div>

                <form id="generate-form" class="form">
                  <label>
                    <span>Session 名称</span>
                    <input name="name" value="张三-CMU-PS" required />
                  </label>
                  <label>
                    <span>学生背景</span>
                    <textarea name="student_background" rows="6" required>AI research, robotics internship, cross-cultural teamwork.</textarea>
                  </label>
                  <label>
                    <span>目标项目</span>
                    <input name="program" value="CMU MSCV" required />
                  </label>
                  <label>
                    <span>生成要求</span>
                    <textarea name="requirements" rows="4" required>900 words, personal statement, emphasize initiative and fit.</textarea>
                  </label>
                  <button id="generate-button" type="submit">开始生成</button>
                </form>
              </aside>

              <section class="task-workspace">
                <div class="panel-heading">
                  <p class="eyebrow">Pipeline Monitor</p>
                  <h2>Task workspace</h2>
                  <p class="lede">聚焦当前阶段输出，随时切换查看 extraction、draft、rewrite。</p>
                </div>

                <nav class="stage-monitor" aria-label="生成阶段">
                  <button class="stage-chip is-selected" type="button" data-stage="extraction" data-state="idle" aria-pressed="true">
                    <span class="stage-chip__name">Extraction</span>
                    <span class="stage-chip__status" id="stage-extraction-status">idle</span>
                  </button>
                  <button class="stage-chip" type="button" data-stage="draft" data-state="idle" aria-pressed="false">
                    <span class="stage-chip__name">Draft</span>
                    <span class="stage-chip__status" id="stage-draft-status">idle</span>
                  </button>
                  <button class="stage-chip" type="button" data-stage="rewrite" data-state="idle" aria-pressed="false">
                    <span class="stage-chip__name">Rewrite</span>
                    <span class="stage-chip__status" id="stage-rewrite-status">idle</span>
                  </button>
                </nav>

                <div class="output-workspace">
                  <div class="output-workspace__header">
                    <div>
                      <p class="meta-label">Focused Output</p>
                      <h3 id="output-title">Extraction</h3>
                    </div>
                    <p class="output-hint">默认跟随活跃阶段，完成后聚焦最终改写稿。</p>
                  </div>

                  <article class="output-panel" data-stage-panel="extraction">
                    <pre id="extraction-output"></pre>
                  </article>
                  <article class="output-panel" data-stage-panel="draft" hidden>
                    <pre id="draft-output"></pre>
                  </article>
                  <article class="output-panel" data-stage-panel="rewrite" hidden>
                    <pre id="rewrite-output"></pre>
                  </article>
                </div>
              </section>
            </section>
          </main>
        </div>

        <div id="tool-coming-soon" style="display:none"></div>
      </main>
    </div>
    <script type="module" src="/js/index.js"></script>
  </body>
</html>

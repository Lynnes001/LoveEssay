<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AdmissionCraft — Sessions</title>
    <link rel="stylesheet" href="/css/base.css" />
    <style>
      .sessions-shell {
        width: min(960px, calc(100% - 32px));
        margin: 32px auto;
      }
      .sessions-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 16px;
      }
      .sessions-header h1 { margin: 0; font-size: 1.5rem; }
      .sessions-header .eyebrow { margin: 0 0 4px; }
      .sessions-header-actions { display: flex; gap: 8px; align-items: center; }
      .btn-primary {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
        font-weight: 500;
      }
      .btn-primary:hover { background: #1748d6; }
      .btn-secondary {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 16px;
        cursor: pointer;
      }
      .btn-secondary:hover { background: var(--panel-subtle); }

      /* Session list */
      .session-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .session-item {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
        text-decoration: none;
        color: inherit;
      }
      .session-item:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(31,94,255,0.08); }
      .session-item__name { font-weight: 600; font-size: 1rem; margin: 0 0 4px; }
      .session-item__meta { font-size: 0.8rem; color: var(--muted); }
      .session-item__status {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 999px;
        white-space: nowrap;
        background: var(--panel-subtle);
        border: 1px solid var(--line);
      }
      .session-item__status[data-status="done"] { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
      .session-item__status[data-status="fact_check_passed"] { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
      .session-item__status[data-status="draft_completed"] { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
      .session-item__status[data-status="outline_confirmed"] { background: #fef9c3; color: #854d0e; border-color: #fde047; }
      .session-item__status[data-status="needs_repair"] { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
      .session-item__status[data-status="needs_repair_manual"] { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
      .session-item__status[data-status="pending"] { background: var(--panel-subtle); color: var(--muted); }

      .sessions-empty {
        text-align: center;
        padding: 64px 24px;
        color: var(--muted);
      }

      /* New session modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .modal-backdrop[hidden] { display: none; }
      .modal {
        background: var(--panel);
        border-radius: 12px;
        padding: 32px;
        width: min(480px, calc(100% - 32px));
        box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      }
      .modal h2 { margin: 0 0 20px; font-size: 1.2rem; }
      .modal label { display: block; margin-bottom: 14px; font-size: 0.9rem; font-weight: 500; }
      .modal label span { display: block; margin-bottom: 4px; color: var(--muted); font-weight: 400; }
      .modal input, .modal select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-subtle);
      }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
      .modal-error { color: var(--failed); font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }

      .nav-bar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 0 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 28px;
      }
      .nav-bar__brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
      .nav-bar a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
      .nav-bar a:hover { color: var(--ink); }
      .nav-bar a.active { color: var(--ink); font-weight: 600; }
      .nav-bar__spacer { flex: 1; }
    </style>
  </head>
  <body>
    <div class="sessions-shell">
      <nav class="nav-bar">
        <span class="nav-bar__brand">AdmissionCraft</span>
        <a href="/index.html" class="active">Sessions</a>
        <a href="/student.html">Students</a>
        <span class="nav-bar__spacer"></span>
        <button id="logout-btn" class="nav-logout-btn" type="button">登出</button>
      </nav>

      <div class="sessions-header">
        <div>
          <p class="eyebrow">Writing Platform</p>
          <h1>Sessions</h1>
        </div>
        <div class="sessions-header-actions">
          <button class="btn-primary" id="new-session-btn">+ 新建 Session</button>
        </div>
      </div>

      <ul class="session-list" id="session-list">
        <li class="sessions-empty">加载中...</li>
      </ul>
    </div>

    <!-- New session modal -->
    <div class="modal-backdrop" id="new-session-modal" hidden>
      <div class="modal">
        <h2>新建 Session</h2>
        <label>
          <span>Session 名称 *</span>
          <input id="new-session-name" type="text" placeholder="例：张三-CMU-PS-2025" />
        </label>
        <label>
          <span>关联学生（可选）</span>
          <select id="new-session-student">
            <option value="">不关联</option>
          </select>
        </label>
        <p class="modal-error" id="new-session-error"></p>
        <div class="modal-actions">
          <button class="btn-secondary" id="new-session-cancel">取消</button>
          <button class="btn-primary" id="new-session-submit">创建</button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/sessions.js"></script>
  </body>
</html>
